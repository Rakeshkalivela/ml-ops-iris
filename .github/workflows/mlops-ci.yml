# this files tells the GitHub exactly waht actions 
#to take every time you push a new code to your repository.

name: MLOps Basic CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    # clone the code insdie the GitHub runnier container
      - name: Checkout Code
        uses: actions/checkout@v4

    # confgur Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
    
    # Install all training and testing requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
    # Run the traning script to generate model.pkl
      - name: Train ML Model
        run: python train.py

    # Run quality control gate test
      - name: RValidate Model Performance
        run: pytest test_model.py

    # Package the successfully validate model int docker image
      - name: Build Inference Docker Image
        run: |
          docker build -t iris-classifier-api:latest .
          echo "Docker image built successfully with the validated model artifact!"

    # Spin up the live container inside the GitHub runner
      - name: Run Container & Test API Endpoints
        run: |
          # Start the container in background mode (-d) and forward port 8000
          docker run -d -p 8000:8000 --name ml-service iris-classifier-api:latest

          # Wait 3 seconds for FastAPI and Uvicorn to finish booting up
          sleep 3

          # 1. Test the Health Check endpoint
          echo "Testing Root Health Endpoint..."
          curl http://localhost:8000/

          # 2. Test the Machine Learning Inference model endpoint with sample data
          echo -e "\nTesting Model Predict Endpoint..."
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'