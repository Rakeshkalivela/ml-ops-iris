# this files tells the GitHub exactly waht actions 
#to take every time you push a new code to your repository.

name: MLOps Basic CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    # clone the code insdie the GitHub runnier container
      - name: Checkout Code
        uses: actions/checkout@v4

    # confgur Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
    
    # Install all training and testing requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
    # Run the traning script to generate model.pkl
      - name: Train ML Model
        run: python train.py

    # Run quality control gate test
      - name: RValidate Model Performance
        run: pytest test_model.py

    # Package the successfully validate model int docker image
      - name: Build Inference Docker Image
        run: |
          docker build -t iris-classifier-api:lates .
          echo "Dcoker image built successfully with the validationmodel artifact!"

